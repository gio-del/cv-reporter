name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (vet, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Render (backend/internal/generation/render.go) shells out to the
      # typst CLI, and generations_render_test.go exercises that real
      # binary — no skip guard. Install the exact version + font pinned in
      # typst-version.txt (ADR-0012, ADR-0016), the same file the backend
      # container and the tailor-cv skill's preflight check read, so the
      # skill's Render path, the container's Render path and CI can't drift
      # apart and these tests behave the same in CI as they do locally.
      # The ATS-parsability
      # check (backend/internal/generation/parsability.go) shells out to
      # pdftotext the same way, so poppler-utils is installed here too —
      # see backend/Dockerfile for why it's pinned there.
      - name: Install typst + Liberation Sans (pinned per ADR-0012)
        run: |
          # The pinned version and font family come from typst-version.txt
          # (repo root) — the same single source of truth backend/Dockerfile
          # sources at build time and the tailor-cv skill's preflight check
          # reads (ADR-0016). Don't hardcode the version here: bumping the
          # pin has to stay a single edit in that file.
          . ./typst-version.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fontconfig poppler-utils
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf /tmp/typst*
          # Fail loudly if what landed isn't what the pin file names.
          typst --version | grep -F "$TYPST_VERSION"
          fc-list | grep -qF "$TYPST_FONT_FAMILY"
          pdftotext -v

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
