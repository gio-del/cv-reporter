name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (lint, vet, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Runs `golangci-lint run ./...` against the repo-root .golangci.yml —
      # the same command and the same config a developer runs locally (see
      # README.md), so a failure here is reproducible without pushing. Placed
      # before the typst/poppler install and the test step: it needs neither
      # binary, so a formatting or dropped-error failure surfaces fast. The
      # linter version is pinned for the same reason ADR-0012/ADR-0016 pin
      # typst — a tool that gates the build doesn't float on latest.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: backend
          args: ./...

      # Render (backend/internal/generation/render.go) shells out to the
      # typst CLI, and generations_render_test.go exercises that real
      # binary — no skip guard. Pin the exact version + font ADR-0012
      # pins for the backend container (see backend/Dockerfile) so these
      # tests behave the same in CI as they do locally. The ATS-parsability
      # check (backend/internal/generation/parsability.go) shells out to
      # pdftotext the same way, so poppler-utils is installed here too —
      # see backend/Dockerfile for why it's pinned there.
      - name: Install typst + Liberation Sans (pinned per ADR-0012)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf /tmp/typst*
          typst --version
          pdftotext -v

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
