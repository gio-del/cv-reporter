name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (vet, test)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      # Render (backend/internal/generation/render.go) shells out to the
      # typst CLI, and generations_render_test.go exercises that real
      # binary — no skip guard. Pin the exact version + font ADR-0012
      # pins for the backend container (see backend/Dockerfile) so these
      # tests behave the same in CI as they do locally. The ATS-parsability
      # check (backend/internal/generation/parsability.go) shells out to
      # pdftotext the same way, so poppler-utils is installed here too —
      # see backend/Dockerfile for why it's pinned there.
      - name: Install typst + Liberation Sans (pinned per ADR-0012)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation poppler-utils
          curl -fsSL https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            -o /tmp/typst.tar.xz
          tar -xf /tmp/typst.tar.xz -C /tmp
          sudo mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          rm -rf /tmp/typst*
          typst --version
          pdftotext -v

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

  frontend:
    name: Frontend (lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # Vitest + Testing Library + MSW (ADR-0018): jsdom and a faked network,
      # so no backend, ANTHROPIC_API_KEY or typst is needed here.
      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build
