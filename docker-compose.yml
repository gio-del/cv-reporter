services:
  backend:
    build: ./backend
    environment:
      DATA_DIR: /workspace/data
      PROJECT_ROOT: /workspace
      PORT: "8080"
    volumes:
      # Render's typst invocation needs template/ and output/ alongside
      # data/, all under one --root (see ADR-0012), so the whole project
      # root is mounted rather than just data/ as before.
      - .:/workspace
    ports:
      - "127.0.0.1:8080:8080"

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend
